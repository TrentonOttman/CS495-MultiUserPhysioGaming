<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Iteration 1: Pong</title>
    <style>
        body {
            font: 16px/1.5 system-ui, sans-serif;
            margin: 2rem auto;
            max-width: 848px;
            padding: 0 1rem;
        }

        #status {
            font-weight: 600;
        }

        #lobby {
            border: 1px solid #8884;
            border-radius: .5rem;
            padding: 1rem 1.25rem;
            margin-bottom: 1.5rem;
            max-width: 32rem;
        }

        #lobby h2 {
            font-size: 1.1rem;
            margin: 0 0 .75rem;
        }

        #lobby label {
            display: block;
            margin-bottom: .6rem;
        }

        #lobby fieldset {
            border: 1px solid #8884;
            border-radius: .35rem;
            margin: 0 0 .75rem;
        }

        #lobby button {
            font: inherit;
            padding: .4rem .9rem;
            border-radius: .35rem;
            cursor: pointer;
        }

        #lobby-error {
            color: #b00020;
            font-weight: 600;
        }

        #lobby [hidden] {
            display: none;
        }

        #arena {
            position: relative;
            width: 800px;
            height: 600px;
            max-width: 100%;
            background: #1114;
            border-radius: .5rem;
            overflow: hidden;
        }

        .player {
            position: absolute;
            width: 24px;
            height: 100px;
            border-radius: 4px;
            background: #4ea1ff;
            will-change: transform;
        }

        .ball {
            position: absolute;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #5e0000;
            will-change: transform;
        }

        .player.self {
            background: #ffd24e;
        }
    </style>
</head>

<body>
    <h1>Iteration 1: Pong</h1>
    <p id="status">Connecting…</p>
    <div id="game" hidden>
        <div>
            <h1 style="text-align: center;" id="score">0 | 0</h1>
        </div>
        <div id="arena"></div>
        <p>Move with <kbd>WS</kbd> or the arrow keys. Open a second tab to see another player and start the game.</p>
    </div>
    <!--<p><a href="/playground">Playground</a> · <a href="/monitor">Monitor</a></p>-->
    <script type="module" src="/src/client/index.ts"></script>
</body>

<body>
    <button id="ganglion">Connect</button>
    <div>
        <canvas id="my_canvas"></canvas>
    </div>
        <p>Current value: <span id="filtered-sample">0</span></p>
    </div>
</body>
<script type="module" src="src/sensor/datastream.js"></script>
<script type="module" src="src/sensor/visualizer.js"></script>

</html>
