<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>PhysioGaming</title>
    <style>
        body {
            font: 16px/1.5 system-ui, sans-serif;
            margin: 2rem auto;
            max-width: 848px;
            padding: 0 1rem;
        }

        #status {
            font-weight: 600;
        }

        #lobby {
            width: 100%;
            max-width: 850px;
            margin: 0 auto 2rem;
        }

        .lobby-header {
            margin-bottom: 1.5rem;
        }

        .lobby-header h2 {
            margin: 0;
            font-size: 1.75rem;
        }

        .lobby-header p {
            margin: .25rem 0 0;
            opacity: .65;
        }

        #lobby-menu {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 1rem;
            align-items: start;
        }

        .lobby-card {
            border: 1px solid #8884;
            border-radius: .75rem;
            padding: 1.5rem;
            background: #8881;
        }

        .card-header {
            margin-bottom: 1.25rem;
        }

        .card-header h3 {
            margin: 0;
            font-size: 1.15rem;
        }

        .card-header p {
            margin: .25rem 0 0;
            font-size: .9rem;
            opacity: .65;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: .35rem;
            margin-bottom: 1rem;
        }

        .form-group label,
        .visibility-options legend {
            font-size: .85rem;
            font-weight: 600;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: .75rem;
        }

        #lobby input,
        #lobby select {
            box-sizing: border-box;
            width: 100%;
            font: inherit;
            padding: .65rem .75rem;

            border: 1px solid #8886;
            border-radius: .4rem;

            background: transparent;
            color: inherit;
        }

        #lobby input:focus,
        #lobby select:focus {
            outline: 2px solid #4ea1ff;
            outline-offset: 1px;
        }

        .visibility-options {
            display: flex;
            flex-direction: column;
            gap: .5rem;

            border: 0;
            padding: 0;
            margin: 0 0 1.25rem;
        }

        .visibility-options legend {
            margin-bottom: .4rem;
        }

        .radio-option {
            display: flex;
            align-items: flex-start;
            gap: .65rem;

            border: 1px solid #8884;
            border-radius: .5rem;
            padding: .75rem;

            cursor: pointer;
        }

        .radio-option:hover {
            background: #8881;
        }

        .radio-option input {
            width: auto !important;
            margin-top: .25rem;
        }

        .radio-option span {
            display: flex;
            flex-direction: column;
        }

        .radio-option small {
            opacity: .6;
            margin-top: .1rem;
        }

        .primary-button,
        .secondary-button {
            width: 100%;
            font: inherit;
            font-weight: 600;

            padding: .7rem 1rem;

            border-radius: .45rem;
            cursor: pointer;
        }

        .primary-button {
            border: 1px solid #4ea1ff;
            background: #4ea1ff;
            color: #111;
        }

        .secondary-button {
            border: 1px solid #8886;
            background: transparent;
            color: inherit;
        }

        .primary-button:hover,
        .secondary-button:hover {
            filter: brightness(1.1);
        }

        #lobby button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        #join-code {
            text-transform: uppercase;
            letter-spacing: .15em;
            font-weight: 700;
        }

        /* Join by code: spans the menu, below the create form and the browser */

        .lobby-join-row {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            gap: .75rem;
        }

        .lobby-divider {
            margin: 0;

            text-align: center;
            text-transform: uppercase;

            font-size: .75rem;
            font-weight: 700;
            letter-spacing: .1em;
            opacity: .45;
        }

        .join-card {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: .75rem 1rem;
            align-items: end;
        }

        .join-card .card-header {
            grid-column: 1 / -1;
            margin-bottom: 0;
        }

        .join-card .form-group {
            margin-bottom: 0;
        }

        /* Public lobby browser */

        .browser-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
        }

        .icon-button {
            flex: none;

            width: 2rem;
            height: 2rem;
            padding: 0;

            font: inherit;
            font-size: 1.1rem;
            line-height: 1;

            border: 1px solid #8886;
            border-radius: .45rem;

            background: transparent;
            color: inherit;
            cursor: pointer;
        }

        .icon-button:hover {
            filter: brightness(1.1);
        }

        .browser-list {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .browser-row {
            display: grid;
            gap: .2rem;

            padding: .8rem 0;

            border-top: 1px solid #8883;
        }

        .browser-row:first-child {
            padding-top: 0;
            border-top: 0;
        }

        .browser-row:last-child {
            padding-bottom: 0;
        }

        .browser-name {
            font-weight: 600;

            /* A lobby name is player-supplied and up to 40 characters. */
            overflow-wrap: anywhere;
        }

        .browser-detail {
            display: flex;
            justify-content: space-between;
            gap: .75rem;

            font-size: .9rem;
            opacity: .7;
        }

        .browser-action {
            display: flex;
            justify-content: flex-end;
        }

        .browser-join {
            width: auto;
            padding: .45rem 1.25rem;
            font-size: .9rem;
        }

        .browser-note {
            margin: .75rem 0 0;
            font-size: .9rem;
            opacity: .65;
        }

        /* Waiting room */

        .waiting-room {
            max-width: 32rem;
            margin: 0 auto;
        }

        .waiting-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
        }

        .waiting-header h2 {
            margin: .15rem 0 0;
        }

        .eyebrow {
            font-size: .7rem;
            font-weight: 700;
            letter-spacing: .1em;
            opacity: .55;
        }

        .status-badge {
            font-size: .8rem;
            font-weight: 600;

            padding: .25rem .6rem;
            border: 1px solid #8885;
            border-radius: 999px;
        }

        .waiting-summary {
            opacity: .7;
        }

        .join-code-container {
            display: flex;
            flex-direction: column;
            align-items: center;

            margin: 1.5rem 0;
            padding: 1rem;

            border: 1px dashed #8887;
            border-radius: .6rem;
        }

        .join-code-container span {
            font-size: .7rem;
            font-weight: 700;
            letter-spacing: .1em;
            opacity: .55;
        }

        #waiting-code {
            margin-top: .25rem;

            font-size: 1.8rem;
            letter-spacing: .15em;
        }

        #lobby-error {
            margin-top: 1rem;
            padding: .75rem 1rem;

            border: 1px solid #b00020;
            border-radius: .5rem;

            color: #d94b62;
            font-weight: 600;
        }

        #lobby [hidden] {
            display: none;
        }

        @media (max-width: 700px) {
            #lobby-menu {
                grid-template-columns: 1fr;
            }

            .form-row,
            .join-card {
                grid-template-columns: 1fr;
            }
        }

        .player {
            position: absolute;
            width: 24px;
            height: 100px;
            border-radius: 4px;
            background: #4ea1ff;
            will-change: transform;
        }

        .ball {
            position: absolute;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #5e0000;
            will-change: transform;
        }

        #arena {
            position: relative;
            width: 800px;
            height: 600px;
            max-width: 100%;
            margin: 1rem auto;
            border: 2px solid #8886;
            background: #1114;
            border-radius: .5rem;
            overflow: hidden;
        }

        .player.self {
            background: #ffd24e;
        }
    </style>
</head>

<body>
    <header>
        <h1>PhysioGaming</h1>
    </header>

    <main id="app">
        <p id="status">Loading…</p>

        <section id="game" hidden>
            <h2 id="game-title">Pong</h2>

            <div>
                <h2 style="text-align: center;" id="score">0 | 0</h2>
            </div>

            <div id="arena"></div>

            <p>
                Move with <kbd>WS</kbd> or the arrow keys.
            </p>
        </section>
    </main>

    <script type="module" src="/src/client/index.ts"></script>
</body>

<body>
    <button id="ganglion">Connect</button>
    <div>
        <canvas id="my_canvas"></canvas>
    </div>
        <p>Current value: <span id="filtered-sample">0</span></p>
    </div>
</body>
<script type="module" src="src/sensor/datastream.js"></script>
<script type="module" src="src/sensor/visualizer.js"></script>

</html>
